name: Phase 0 — TiDB Connection Probe (TEMPORARY)

# TEMPORARY WORKFLOW — delete after Phase 0 passes from GitHub Actions.
# Run manually via workflow_dispatch to prove GitHub Actions → TiDB connectivity
# before executing Phase 1 (data migration).

on:
  workflow_dispatch:

jobs:
  tidb-connection-probe:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verify CA cert exists in repo
        run: |
          echo "Checking certs/isrgrootx1.pem..."
          ls -la certs/
          head -1 certs/isrgrootx1.pem

      - name: 🔌 Test TiDB Cloud Connection (Phase 0 Probe)
        env:
          # Database credentials — from GitHub Secrets
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # SSL config — not secrets; CA cert is public and committed to repo
          DB_SSL: "true"
          DB_SSL_CA: "certs/isrgrootx1.pem"
        run: |
          python scripts/test_tidb_connection.py
