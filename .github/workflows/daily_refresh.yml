name: SkillPulse Daily Cloud Refresh & Retrain

on:
  schedule:
    # Runs daily at 02:14 UTC (07:44 AM IST) - offset minute prevents GitHub cron queue drops
    - cron: '14 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  refresh-and-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Retrain XGBoost Model & Refresh Telemetry
        run: |
          python scripts/refresh_snapshot.py

      - name: 🚀 Commit & Push updated model and snapshot to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_exports/db_snapshot.json models/xgboost_model.joblib data_exports/feature_names.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh: Cloud daily retrain & job telemetry [skip ci]" && git push origin main)

      - name: 🌐 Keep Streamlit App Awake (HTTP Ping)
        run: |
          curl -s -o /dev/null -w "Streamlit App Status: %{http_code}\n" https://skillpulse.streamlit.app
