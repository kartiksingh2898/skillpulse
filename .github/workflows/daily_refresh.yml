name: SkillPulse Daily Cloud Refresh & Retrain

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  refresh-and-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Retrain XGBoost Model & Refresh Telemetry
        run: |
          python scripts/refresh_snapshot.py

      - name: 🚀 Commit & Push updated model and snapshot to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_exports/db_snapshot.json models/xgboost_model.joblib data_exports/feature_names.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh: Cloud daily retrain & job telemetry [skip ci]" && git push origin main)
